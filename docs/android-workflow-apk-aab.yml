# ============================================================================
# UPDATED Android workflow — builds BOTH the debug APK and the release AAB.
#
# WHY THIS FILE LIVES IN docs/: the automation that prepared the Android
# conversion cannot modify .github/workflows/** (its GitHub App token lacks
# the `workflows` permission — pushes touching that path are rejected by
# GitHub). To activate this workflow, a human with normal repo access just
# replaces the existing workflow with this file:
#
#     git mv docs/android-workflow-apk-aab.yml .github/workflows/android-apk.yml
#     git commit -m "Android CI: also build release AAB"
#     git push
#
# Until then, the EXISTING .github/workflows/android-apk.yml continues to
# work and — thanks to the capacitor:sync:after hook
# (scripts/android-postsync.mjs) — already produces a debug APK with the
# real brand icons, splash screens, version stamping, and back-button
# handling. The ONLY thing it does not produce is the release AAB.
# ============================================================================
name: Android Build (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'www/**'
      - 'resources/**'
      - 'scripts/android-postsync.mjs'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 (required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      # Generates the android/ native project fresh on every run,
      # reading appId/appName/server.url from capacitor.config.ts.
      # It is intentionally NOT committed (see .gitignore).
      - name: Add Android platform
        run: npx cap add android

      # The capacitor:sync:after hook (scripts/android-postsync.mjs)
      # automatically: generates all launcher-icon densities + splash
      # screens from resources/, stamps versionName (package.json) and
      # versionCode ($ANDROID_VERSION_CODE), and writes the
      # back-button-aware MainActivity.
      - name: Sync Capacitor config into the native project
        run: npx cap sync android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build debug APK and release AAB
        run: |
          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Maharani-Traders-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Maharani-Traders-release.aab
          ls -la Maharani-Traders-*

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maharani-Traders-debug-apk
          path: Maharani-Traders-debug.apk
          if-no-files-found: error

      # UNSIGNED — Play upload requires a one-time upload keystore.
      # See docs/android.md § Release signing. Never commit keystores
      # or passwords; store them as GitHub Actions secrets.
      - name: Upload release AAB artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Maharani-Traders-release-aab
          path: Maharani-Traders-release.aab
          if-no-files-found: error
