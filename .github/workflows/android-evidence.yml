name: Android artifact evidence

on:
  workflow_run:
    workflows: ['Native Android Debug APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed native build run to inspect
        required: true
        default: '37762817214'
      baseline_run_id:
        description: Completed baseline build run
        required: true
        default: '37741621723'

permissions:
  actions: read
  contents: write

jobs:
  evidence:
    # Only after a GREEN native build of a live session branch, or by hand.
    # A push of this file must NOT publish evidence for whatever stale run id
    # the defaults name — evidence for the wrong commit is worse than none.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'arena/e6c5711c-maharani-mart' || github.event.workflow_run.head_branch == 'arena/ff1279ad-maharani-mart'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Download actual artifacts on runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id || '37762817214' }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '37741621723' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --json status,conclusion,headSha > /tmp/run.json
          gh run view "$BASELINE_RUN_ID" --json status,conclusion,headSha > /tmp/baseline.json
          gh run download "$RUN_ID" --dir /tmp/current
          gh run download "$BASELINE_RUN_ID" --dir /tmp/baseline
      - name: Measure, inspect reports and publish evidence through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id || '37762817214' }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '37741621723' }}
        run: |
          set -euo pipefail
          python3 scripts/android-ci-evidence.py /tmp/current /tmp/baseline /tmp/run.json /tmp/baseline.json > /tmp/evidence.md
          cat /tmp/evidence.md >> "$GITHUB_STEP_SUMMARY"
          SHA=$(python3 -c 'import json;print(json.load(open("/tmp/run.json"))["headSha"])')
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/comments" -f body="$(cat /tmp/evidence.md)"
