# Maharani Traders — native Android CI.
#
# This is the ACTIVE Android pipeline. It replaces the retired Capacitor /
# remote-URL WebView builder, which was removed together with
# capacitor.config.ts, www/ and scripts/android-postsync.mjs.
#
# It builds the committed native Kotlin/Compose project in android/ and nothing
# else. No release signing, no key, no AAB publication — a debug APK signed by
# Gradle's throwaway debug keystore only, plus an UNSIGNED release APK and AAB
# built purely for size measurement (scripts/android-apk-size-report.py).
# Play-store publication is a separate, human-controlled step.

name: Native Android Debug APK

# AUTO-TRIGGERS DISABLED (2026-10-25) — zero-cost CI change, no job removed.
#
# This product ships as a WEB PWA. The Kotlin/Compose tree under android/ is
# historical and is not built, signed or released by the delivery pipeline, so
# automatically spending GitHub Actions minutes on it (and on a second copy of
# the web gate) was pure cost on a private Free-tier repository:
#
#   * `push` matched `tests/**` and `package.json`, so nearly every commit
#   * `pull_request` doubled that, once per event
#   * the Android job alone had a 45-minute timeout
#
# The jobs below are kept byte-for-byte so a native investigation is still
# reproducible — they are simply manual now. Web checks moved to ci.yml, which
# is the only workflow that runs on normal developer activity.
#
#   * the `web` job stays because `android` declares `needs: web`
#   * `production-probe` no longer runs on pull requests; production is probed
#     by production-health.yml (push to main + daily schedule + manual)
#
# Manual native run: Actions → "Native Android Debug APK" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  # Only used to post the build-diagnostics bundle as a pull-request comment:
  # Actions log files and artifacts are served from a host that is unreachable
  # from some environments, while api.github.com is not.
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install web dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type check
        run: corepack pnpm run typecheck

      - name: Lint
        run: corepack pnpm run lint

      - name: Run web tests
        run: corepack pnpm test

      - name: Build Next.js production app
        run: corepack pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  android:
    name: Android unit tests, lint, and debug APK
    # Historical native diagnostic only. This product ships as a web PWA:
    # web/health jobs above and below MUST still run for web-only PRs/pushes,
    # but those events must not build an APK or unsigned release artifact.
    # A separate manual dispatch is required for any native investigation.
    if: github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and build cache
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify the Gradle wrapper distribution
        working-directory: android
        run: |
          ./gradlew --no-daemon --version | tee /tmp/gradle-version.txt
          grep -F 'Gradle 9.1.0' /tmp/gradle-version.txt

      # Tests, lint and the debug APK in one Gradle invocation. The log is teed
      # to /tmp/gradle.log because Actions logs live in Azure blob storage, which
      # is not reachable from every environment: the next step re-emits the
      # failure detail as check annotations, served by api.github.com.
      - name: Run Android unit tests, lint, and assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee /tmp/gradle.log

      # Azure blob storage (where Actions logs live) is not reachable from every
      # environment, so the failure detail is re-emitted as CHECK ANNOTATIONS,
      # which are served by api.github.com. Without this a compiler error would
      # be invisible outside the web UI.
      - name: Surface Gradle failures as check annotations
        if: failure()
        run: |
          set +e
          LOG=/tmp/gradle.log
          if [ ! -f "$LOG" ]; then
            echo "::error::Gradle produced no log file — the step failed before the build started."
            exit 0
          fi
          # Emit the ROOT cause first: Gradle prints the outer exception, then
          # "What went wrong", then the real cause. An earlier version of this
          # step matched only the outer lines and hid the actual message.
          # One annotation per section, newlines escaped as %0A: the step has an
          # annotation budget of about ten, and the check-run API does not
          # preserve emission order.
          emit_block() {
            # One annotation per section, newlines escaped as %0A, because about
            # ten annotations per step survive and the check-run API does not
            # return them in emission order. Escaping happens after the cut: a
            # byte-truncated escape sequence would leave a dangling % in the
            # annotation. The budget is bytes, not lines - a Kotlin diagnostic
            # block of 200 lines is roughly 30 kB and still fits inside the
            # annotation limit, while a 100-line cut silently hid the errors
            # belonging to every module after the first one that failed.
            local title="$1" body
            body=$(sed -e 's/\r//g' | cut -c1-300 | head -n 240 | head -c 24000 \
                     | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            printf '::error title=%s::%s\n' "$title" "$body"
          }

          WHY=$(awk '/^\* What went wrong:/{f=1} f{print; c++} c>24{exit}' "$LOG")
          [ -z "$WHY" ] && WHY=$(awk '/What went wrong/{f=1} f{print; c++} c>24{exit}' "$LOG")
          [ -n "$WHY" ] && printf '%s\n' "$WHY" | emit_block "gradle: what went wrong"

          CAUSES=$(grep -E "Caused by:" "$LOG" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -20)
          [ -n "$CAUSES" ] && printf '%s\n' "$CAUSES" | emit_block "gradle: caused by"

          KTERR=$(grep -E "^(e|w): " "$LOG" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -200)
          [ -n "$KTERR" ] && printf '%s\n' "$KTERR" | emit_block "kotlin diagnostics"

          if [ -z "$WHY$CAUSES$KTERR" ]; then
            grep -v "^[[:space:]]*$" "$LOG" | tail -30 | emit_block "gradle: no known pattern, log tail"
          fi
          echo "::notice::Full Gradle log is in the failed step's output and in the Gradle test/lint reports artifact."

      # A failing unit test is the one failure class the log cannot explain: Gradle
      # prints "There were failing tests" and a path to an HTML report, and that
      # report lives in an artifact served from a host that is not always
      # reachable. The JUnit XML is on the runner, so the failing test names and
      # their assertion messages are extracted here instead.
      - name: Summarise failing Android unit tests
        if: failure()
        run: |
          set +e
          python3 - > /tmp/test-failures.txt 2>&1 <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = 0
          for path in sorted(glob.glob('android/**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception as error:
                  print(f'{path}: unreadable ({error})')
                  continue
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  cases = list(suite.findall('testcase'))
                  bad = [
                      case
                      for case in cases
                      if case.find('failure') is not None or case.find('error') is not None
                  ]
                  if not bad:
                      continue
                  found += len(bad)
                  print(f'== {suite.get("name")} - {len(bad)} of {suite.get("tests")} failed')
                  for case in bad:
                      node = case.find('failure')
                      if node is None:
                          node = case.find('error')
                      message = ' '.join((node.get('message') or '').split())[:400]
                      print(f'   x {case.get("name")}')
                      print(f'     {node.get("type")}: {message}')
          print(f'(total failing tests: {found})')
          PY
          cat /tmp/test-failures.txt
          if [ -s /tmp/test-failures.txt ]; then
            body=$(sed -e 's/\r//g' /tmp/test-failures.txt | cut -c1-300 | head -n 200 | head -c 24000 \
                     | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            printf '::error title=android unit test failures::%s\n' "$body"
          fi

      - name: Verify debug APK identity, version, and signing status
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -f "$APK_PATH"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          # Expected identity is read from the build script, so the check can
          # never drift from what the build actually configured. The package id
          # is ALSO pinned here: renaming it must fail loudly in two places.
          EXPECTED_PKG=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test "$EXPECTED_PKG" = "com.maharanitraders.app"

          # versionCode/versionName are DERIVED from android/version.properties
          # by build.gradle.kts (there is deliberately no literal versionCode =
          # <number> left in the build script), so the expected values are read
          # from that file. Reading the build script instead produced an empty
          # expectation and failed the identity grep; this is the same source of
          # truth the next step verifies the artifact against.
          PROPS=android/version.properties
          read_prop() { sed -n "s/^$1=//p" "$PROPS" | head -1; }
          V_MAJOR=$(read_prop VERSION_MAJOR)
          V_MINOR=$(read_prop VERSION_MINOR)
          V_PATCH=$(read_prop VERSION_PATCH)
          EXPECTED_CODE=$(read_prop VERSION_CODE)
          EXPECTED_NAME="$V_MAJOR.$V_MINOR.$V_PATCH"
          for value in "$V_MAJOR" "$V_MINOR" "$V_PATCH" "$EXPECTED_CODE"; do
            case "$value" in
              ''|*[!0-9]*) echo "::error title=version policy::$PROPS has a blank or non-numeric version field"; exit 1 ;;
            esac
          done
          echo "expected: package=$EXPECTED_PKG versionCode=$EXPECTED_CODE versionName=$EXPECTED_NAME"
          echo "aapt=$AAPT apksigner=$APKSIGNER"
          echo "build-tools available: $(ls -1 "${ANDROID_HOME}/build-tools" 2>/dev/null | tr '\n' ' ')"

          BADGING=$("$AAPT" dump badging "$APK_PATH")
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PKG'"
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PKG' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'"
          echo "APK identity: PASS ($EXPECTED_PKG versionCode=$EXPECTED_CODE versionName=$EXPECTED_NAME)"

          # Signing status of the DEBUG APK: Gradle's throwaway debug keystore
          # only. The certificate digest printed here is public information —
          # apksigner prints digests, never keys.
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee /tmp/debug-signing.txt
          grep -F 'CN=Android Debug' /tmp/debug-signing.txt
          echo "debug signing: PASS (Android debug keystore, per policy)"

          {
            echo ""
            echo "### APK identity and signing evidence — \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| Artifact | Package | versionCode | versionName | Signing |"
            echo "|---|---|---|---|---|"
            echo "| app-debug.apk | \`$EXPECTED_PKG\` | $EXPECTED_CODE | \`$EXPECTED_NAME\` | Android debug keystore (throwaway, runner-local) |"
          } >> /tmp/apk-identity.md

      # The version is read back OUT OF THE BUILT ARTIFACT and compared with
      # android/version.properties, rather than trusting the properties file: a
      # stale configuration-cache entry or a second defaultConfig block would
      # otherwise ship a version nobody intended. This is also the gate that
      # proves the "1.0.0-phase-b" pre-release marker is really gone.
      - name: Verify artifact version against the declared version policy
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          PROPS=android/version.properties

          read_int() {
            local key="$1" value
            value=$(sed -n "s/^${key}=\([0-9][0-9]*\)$/\1/p" "$PROPS")
            if [ -z "$value" ]; then
              echo "::error title=version policy::$PROPS does not define $key as a plain integer"
              exit 1
            fi
            printf '%s' "$value"
          }

          MAJOR=$(read_int VERSION_MAJOR)
          MINOR=$(read_int VERSION_MINOR)
          PATCH=$(read_int VERSION_PATCH)
          EXPECTED_CODE=$(read_int VERSION_CODE)
          EXPECTED_NAME="${MAJOR}.${MINOR}.${PATCH}"
          echo "declared: versionName=${EXPECTED_NAME} versionCode=${EXPECTED_CODE}"

          # A public artifact must not carry a pre-release marker.
          case "$EXPECTED_NAME" in
            *-*|*_*) echo "::error title=version policy::versionName '${EXPECTED_NAME}' must be plain MAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac

          for APK in \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/*.apk
          do
            [ -f "$APK" ] || continue
            BADGING=$("$AAPT" dump badging "$APK")
            printf '%s\n' "$BADGING" | grep -F "package: name='com.maharanitraders.app'" >/dev/null
            ACTUAL=$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2/p")
            echo "$(basename "$APK"): $ACTUAL"
            if [ "$ACTUAL" != "${EXPECTED_CODE} ${EXPECTED_NAME}" ]; then
              echo "::error title=version mismatch::$(basename "$APK") reports '${ACTUAL}', expected '${EXPECTED_CODE} ${EXPECTED_NAME}'"
              exit 1
            fi
          done
          echo "OK: every built artifact carries the declared version."
          {
            echo ""
            echo "### Version policy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| applicationId | \`com.maharanitraders.app\` |"
            echo "| versionName | \`${EXPECTED_NAME}\` |"
            echo "| versionCode | \`${EXPECTED_CODE}\` |"
            echo "| Source | \`android/version.properties\` (verified against the built artifacts) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The RELEASE APK and AAB are built UNSIGNED on purpose: no keystore, no
      # secret, no publication. Their only job is to measure what a production
      # artifact weighs (R8 + resource shrinking enabled) and how large the
      # Play-delivered slices would be. Size never fails the build here; the
      # report states PASS / ABOVE TARGET and humans decide.
      - name: Build unsigned release APK and AAB for size measurement
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee -a /tmp/gradle.log

      # Signed-release readiness gate. The release keystore lives in repository
      # secrets (RELEASE_KEYSTORE_PATH is the file on disk once decoded) and is
      # deliberately ABSENT here: the unsigned artifacts may pass as size
      # evidence, but signed-release readiness stays BLOCKED — reported in the
      # summary on every run, never quietly assumed. Only the PRESENCE of each
      # secret is printed (true/false); a secret VALUE must never reach the log,
      # and the audit step below enforces that.
      - name: Verify release artifacts are unsigned and report signing readiness
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD != '' }}
          HAS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS != '' }}
          HAS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          APK_SIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          RELEASE_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)

          # The release APK MUST be unsigned in this pipeline. apksigner verify
          # exits non-zero on an unsigned APK — that is the PASS condition here.
          if "$APK_SIGNER" verify "$RELEASE_APK" >/tmp/release-signing.txt 2>&1; then
            echo "::error::release APK is SIGNED but this pipeline must only produce unsigned artifacts"
            exit 1
          fi
          grep -E 'DOES NOT VERIFY|Not signed|Failed to verify' /tmp/release-signing.txt | head -3
          echo "release artifact: UNSIGNED (expected — publication is a separate, human-controlled step)"

          if [ "$HAS_RELEASE_KEYSTORE" = "true" ] && [ "$HAS_RELEASE_KEYSTORE_PASSWORD" = "true" ] \
             && [ "$HAS_RELEASE_KEY_ALIAS" = "true" ] && [ "$HAS_RELEASE_KEY_PASSWORD" = "true" ]; then
            READINESS="READY-TO-SIGN (all four release-keystore secrets are configured; signing itself remains a manual release step)"
          else
            READINESS="**BLOCKED** — release keystore secrets not configured (RELEASE_KEYSTORE present: $HAS_RELEASE_KEYSTORE, password: $HAS_RELEASE_KEYSTORE_PASSWORD, alias: $HAS_RELEASE_KEY_ALIAS, key password: $HAS_RELEASE_KEY_PASSWORD). The unsigned build passes as size evidence only; signed-release readiness remains BLOCKED."
            echo "::warning::signed-release readiness BLOCKED — release keystore secrets are not configured"
          fi

          RELEASE_APK_NAME=$(basename "$RELEASE_APK")
          EXPECTED_PKG=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          EXPECTED_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1)
          EXPECTED_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          {
            echo "| \`$RELEASE_APK_NAME\` + AAB | \`$EXPECTED_PKG\` | $EXPECTED_CODE | \`$EXPECTED_NAME\` | UNSIGNED (verified) |"
            echo ""
            echo "#### Signed-release readiness"
            echo ""
            echo "$READINESS"
            echo ""
            echo "No keystore password, token or private signing material was printed by this job; the audit step enforces it."
          } >> /tmp/apk-identity.md
          cat /tmp/apk-identity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Measure artifact sizes and generate breakdown
        run: |
          set -o pipefail
          python3 scripts/android-apk-size-report.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/*.apk \
            android/app/build/outputs/bundle/release/*.aab \
            | tee /tmp/size-report.md
          cat /tmp/size-report.md >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------
      # SIGNED RELEASE — inert until the keystore secrets exist.
      # -------------------------------------------------------------------
      # Every step below is gated on `steps.keystore.outputs.configured`, so
      # with no secrets configured this job behaves EXACTLY as it did before:
      # the unsigned measurement artifacts stay the only release output and the
      # pipeline stays green. Nothing here can be triggered by a fork's PR,
      # because GitHub does not pass secrets to pull_request events from forks.
      #
      # The keystore is decoded to /tmp, OUTSIDE the workspace, so it can never
      # be committed, uploaded as an artifact, or left behind in the checkout.
      # No secret VALUE is ever echoed: only whether it is present.
      - name: Decode the release keystore when CI secrets provide one
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ]  || missing="$missing ANDROID_RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]       || missing="$missing ANDROID_RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]    || missing="$missing ANDROID_RELEASE_KEY_PASSWORD"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=signed release BLOCKED::No signing material is configured. Missing secret(s):$missing. \
          The release artifact in this run is UNSIGNED and must NOT be given to a retailer or uploaded to Play. \
          Setup steps: docs/ANDROID_RELEASE_SIGNING.md"
            {
              echo ""
              echo "### Signed release"
              echo ""
              echo "**BLOCKED** — no signing material is configured."
              echo ""
              echo "Missing secret(s):$(printf '%s\n' "$missing" | sed 's/^/ `/' | sed 's/$/`/')"
              echo ""
              echo "The release artifact produced by this run is **UNSIGNED** and must not be"
              echo "distributed. See \`docs/ANDROID_RELEASE_SIGNING.md\` for the exact setup."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p /tmp/maharani-signing
          chmod 700 /tmp/maharani-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/maharani-signing/release.keystore
          chmod 600 /tmp/maharani-signing/release.keystore
          BYTES=$(stat -c%s /tmp/maharani-signing/release.keystore)
          if [ "$BYTES" -lt 100 ]; then
            echo "::error title=keystore decode failed::the decoded keystore is only $BYTES bytes — the base64 secret is malformed"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "keystore decoded to a runner-local path outside the workspace ($BYTES bytes)"

      - name: Build the SIGNED release APK and AAB
        if: steps.keystore.outputs.configured == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: /tmp/maharani-signing/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee -a /tmp/gradle.log

      - name: Verify the signed artifact with apksigner
        if: steps.keystore.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk)
          AAB=$(ls android/app/build/outputs/bundle/release/app-release.aab)
          test -f "$APK"; test -f "$AAB"

          # A signed build is named app-release.apk; an unsigned one is named
          # app-release-unsigned.apk. Asserting the SIGNED filename exists is
          # what stops an unsigned artifact from being described as a release.
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::warning::an unsigned release APK is also present from the earlier measurement step — \
          only app-release.apk is distributable"
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt 2>&1 || {
            cat /tmp/apksigner.txt
            echo "::error title=apksigner rejected the release APK::see the output above"
            exit 1
          }
          # Only the verdict, the signing schemes and the certificate digests are
          # published. Those are public by construction — every installed APK
          # exposes them — but the alias and passwords are never printed.
          grep -E '^(Verifies|Verified using|Number of signers|Signer #1 certificate SHA-256 digest)' /tmp/apksigner.txt \
            | tee /tmp/apksigner-summary.txt
          grep -qE '^Verifies$' /tmp/apksigner.txt
          grep -qE '^Verified using v2 scheme \(APK Signature Scheme v2\): true$' /tmp/apksigner.txt

          {
            echo ""
            echo "### Signed release"
            echo ""
            echo "**VERIFIED** — \`apksigner\` accepts the signed release APK."
            echo ""
            echo '```'
            cat /tmp/apksigner-summary.txt
            echo '```'
            echo ""
            echo "| Artifact | Bytes |"
            echo "|---|---:|"
            echo "| \`app-release.apk\` (signed) | $(stat -c%s "$APK") |"
            echo "| \`app-release.aab\` (signed) | $(stat -c%s "$AAB") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure the signed artifact sizes
        if: steps.keystore.outputs.configured == 'true'
        run: |
          set -o pipefail
          {
            echo ""
            echo "### Signed release sizes"
            echo ""
          } >> /tmp/size-report.md
          python3 scripts/android-apk-size-report.py \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            | tee -a /tmp/size-report.md

      - name: Destroy the decoded keystore
        if: always()
        run: |
          set +e
          # Belt and braces: later steps upload artifacts by path, and /tmp is
          # outside every one of those paths, but the runner is not ours to leave
          # key material on.
          rm -rf /tmp/maharani-signing
          echo "runner-local signing directory removed"

      # Best effort only: proves what a device would actually download from
      # Play (bundletool splits the AAB per ABI/density/language). Every code
      # path — success or failure — appends its evidence to the size report so
      # a silent skip is impossible; failure warns and moves on and never
      # turns a green build red.
      - name: Estimate Play delivery size with bundletool (best effort)
        run: |
          set +e
          BT_VERSION=1.18.1
          {
            echo ""
            echo "### Play delivery estimate (bundletool ${BT_VERSION})"
            echo ""
            echo '```'
            curl -fsSL -o /tmp/bundletool.jar \
              "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"
            echo "curl exit: $?  jar bytes: $(stat -c%s /tmp/bundletool.jar 2>/dev/null || echo 0)"
            # THROWAWAY measurement keystore, generated fresh on the runner:
            # build-apks signs its output, and this signature is never used for
            # distribution — only for get-size measurement. No real key, no
            # secret, nothing persisted. The keystore password is passed through
            # env: references so that not even this throwaway literal appears in
            # the job log (see the audit step below).
            export SIZE_KS_PASS=android
            keytool -genkeypair -keystore /tmp/size.keystore -storepass "$SIZE_KS_PASS" \
              -keypass "$SIZE_KS_PASS" -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 1 -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -2
            AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1)
            echo "bundle: $AAB"
            java -jar /tmp/bundletool.jar build-apks \
              --bundle="$AAB" --output=/tmp/app-device.apks --overwrite \
              --ks=/tmp/size.keystore --ks-pass env:SIZE_KS_PASS \
              --ks-key-alias androiddebugkey --key-pass env:SIZE_KS_PASS 2>&1
            echo "build-apks exit: $?"
            if [ -f /tmp/app-device.apks ]; then
              java -jar /tmp/bundletool.jar get-size total --apks=/tmp/app-device.apks 2>&1
              echo "get-size exit: $?"
            fi
            echo '```'
          } | tee -a /tmp/size-report.md
          if ! grep -q "get-size exit: 0" /tmp/size-report.md; then
            echo "::warning::bundletool could not estimate Play delivery size — see the size report for its exact error"
          fi
          exit 0

      - name: Post the size report to the pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # On a pull_request event GITHUB_REF_NAME is "<pr>/merge", which matches
          # no head branch and made this silently fall back to commit comments.
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
                   --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "no open pull request for $GITHUB_REF_NAME — size report stays in the job summary and artifact"
            exit 0
          fi
          {
            printf '### Android artifact size report — `%s`\n\n' "${GITHUB_SHA:0:7}"
            head -c 55000 /tmp/size-report.md
          } > /tmp/size-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/size-comment.md \
            || echo "::warning::could not post the size comment"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maharani-traders-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK, AAB, and size report
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maharani-traders-release-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            /tmp/size-report.md
          if-no-files-found: error
          retention-days: 7

      # HARD GATE: this job must never print a keystore password, a token or
      # private signing material. Every log file the job produced is scanned
      # both for structural secret shapes (PEM private keys, GitHub tokens,
      # non-redacted Gradle signing properties) and for the literal values of
      # the release-keystore secrets when they exist — the only proof that
      # matters is "the actual secret value is not in the log". The secret
      # values enter this step masked and are never echoed; only match/no-match
      # is printed. The one password literal that CAN appear is the runner-local
      # throwaway measurement keystore's default (visible in the step script
      # Actions itself echoes); it protects nothing, dies with the runner, and
      # is never a distribution key.
      - name: Audit logs for keystore passwords, tokens, and private signing material
        if: always()
        env:
          SCAN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SCAN_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SCAN_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SCAN_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          GH_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=""
          for f in /tmp/gradle.log /tmp/size-report.md /tmp/apk-identity.md \
                   /tmp/test-failures.txt /tmp/debug-signing.txt /tmp/release-signing.txt \
                   /tmp/diagnostics.txt; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          echo "scanning:$FILES"
          FAIL=0

          # 1. Structural secret shapes.
          if grep -HnE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' $FILES; then
            echo "::error::private key material found in job output"; FAIL=1
          fi
          if grep -HnE -- '\bgh[pousr]_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b' $FILES; then
            echo "::error::GitHub token material found in job output"; FAIL=1
          fi
          # Gradle masks these as *** when it prints them; any visible value is a leak.
          if grep -HnE -- '(storePassword|keyPassword) = [^*[:space:]]' $FILES; then
            echo "::error::unmasked signing property found in job output"; FAIL=1
          fi

          # 2. Literal values of configured secrets (only when they exist).
          check_value() {
            local label="$1" value="$2"
            if [ -n "$value" ]; then
              if grep -HnF -- "$value" $FILES; then
                echo "::error::$label literal found in job output"; FAIL=1
              else
                echo "$label: present as secret, NOT found in job output — PASS"
              fi
            else
              echo "$label: not configured in this repository"
            fi
          }
          check_value "RELEASE_KEYSTORE_PASSWORD" "$SCAN_RELEASE_KEYSTORE_PASSWORD"
          check_value "RELEASE_KEY_ALIAS" "$SCAN_RELEASE_KEY_ALIAS"
          check_value "RELEASE_KEY_PASSWORD" "$SCAN_RELEASE_KEY_PASSWORD"
          check_value "RELEASE_KEYSTORE (base64)" "$SCAN_RELEASE_KEYSTORE"
          check_value "GITHUB_TOKEN" "$GH_TOKEN_VALUE"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::log audit FAILED — signing material or tokens were printed"
            exit 1
          fi
          echo "log audit PASS: no keystore passwords, tokens, or private signing material in job output"
          echo "### Secret-print audit: **PASS** (no keystore password, token, or private key in any job log)" >> "$GITHUB_STEP_SUMMARY"

      # Actions log files are served from a host that is not reachable from every
      # environment, and check annotations are capped at about ten per step. On a
      # failure that is not enough to see a Gradle stack trace, so everything the
      # job printed is bundled here as a downloadable artifact instead.
      - name: Bundle build diagnostics
        if: always()
        run: |
          set +e
          OUT=/tmp/diagnostics.txt
          {
            echo "=== HEAD ==="; git rev-parse HEAD 2>/dev/null
            echo "=== java ==="; java -version 2>&1 | head -3
            echo "=== gradle ==="; sed -n '1,10p' /tmp/gradle-version.txt 2>/dev/null
            echo "=== configuration cache ==="
            grep -iE "configuration cache|reusing configuration|configuration-cache" /tmp/gradle.log 2>/dev/null | head -20
            echo "=== what went wrong ==="
            awk '/^\* What went wrong:/{f=1} f{print; c++} c>30{exit}' /tmp/gradle.log 2>/dev/null
            echo "=== caused by ==="
            grep -E "Caused by:" /tmp/gradle.log 2>/dev/null | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -25
            echo "=== kotlin diagnostics (build) ==="
            grep -E "^(e|w): " /tmp/gradle.log 2>/dev/null | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -60
            echo "=== android unit test failures ==="; cat /tmp/test-failures.txt 2>/dev/null
            echo "=== artifact size report ==="; cat /tmp/size-report.md 2>/dev/null
            echo "=== gradle log tail ==="; tail -60 /tmp/gradle.log 2>/dev/null
          } > "$OUT" 2>&1
          wc -l "$OUT" || true
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-build-diagnostics
          path: /tmp/diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

      # Log files and artifacts are served from a host that is unreachable from
      # some environments; api.github.com is not, so the same bundle is posted as
      # a pull-request comment. Non-fatal by design: a comment failure must never
      # turn a diagnosable build into an undiagnosable one.
      - name: Post the diagnostics bundle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # On a pull_request event GITHUB_REF_NAME is "<pr>/merge", which matches
          # no head branch and made this silently fall back to commit comments.
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
                   --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            # Session branches may intentionally have no duplicate PR. Keep
            # diagnostics accessible via api.github.com, not blocked blob hosts.
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -f body="$(printf '### Android CI diagnostics\n\n```\n'; head -c 55000 /tmp/diagnostics.txt; printf '\n```\n')" \
              || echo "::warning::could not post commit diagnostics"
            # Second, independent channel: an issue. Commit comments are not
            # always retrievable by automation clients, while the issues API is
            # (this repository's Actions artifacts and log archives are served
            # from hosts that some sandboxes cannot reach). Best effort only.
            gh api "repos/$GITHUB_REPOSITORY/issues" \
              -f title="Android CI diagnostics — ${GITHUB_SHA:0:7}" \
              -f body="$(printf '### Android CI diagnostics — %s\n\nRun: %s\n\n```\n' "${GITHUB_SHA:0:7}" "$GITHUB_RUN_ID"; head -c 55000 /tmp/diagnostics.txt; printf '\n```\n')" \
              || echo "::warning::could not open a diagnostics issue"
            exit 0
          fi
          {
            printf '### Android CI diagnostics — \`%s\`\n\n' "${GITHUB_SHA:0:7}"
            printf '```\n'
            head -c 55000 /tmp/diagnostics.txt
            printf '\n```\n'
          } > /tmp/diagnostics-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnostics-comment.md \
            || echo "::warning::could not post the diagnostics comment"
          # Keep the PR from filling up with debugging noise: remove any previous
          # comment from this bot that carries the same heading.
          echo "posted diagnostics for ${GITHUB_SHA:0:7} to #$PR"

      - name: Upload Gradle test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-reports
          path: android/**/build/reports
          if-no-files-found: warn
          retention-days: 7

  # Production probe: is the ONE fixed deployment actually answering?
  #
  # Runs in its own job so a production outage is visible without turning the
  # Android build red (the APK can be perfectly healthy while the API is not,
  # and vice versa). The verdict is ALWAYS written to the job summary — the
  # probe itself prints it before any exit — and the job's conclusion is the
  # verdict:
  #
  #   PRODUCTION_REACHABLE   success
  #   PRODUCTION_ERROR       failure (host answered, app unhealthy)
  #   PRODUCTION_UNREACHABLE failure (controls answered, production did not)
  #   NETWORK_RESTRICTED     success + warning (this runner cannot test
  #                          production; that is NOT reported as an outage)
  production-probe:
    name: Production probe (maharanitraders.vercel.app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Probe the fixed production URL
        id: probe
        run: |
          set +e
          node scripts/production-probe.mjs
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "4" ]; then
            echo "::warning::production probe could not test production from this runner (network restricted) — verdict NETWORK_RESTRICTED, NOT an outage"
          fi
          exit 0

      - name: Gate on the probe verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODE="${{ steps.probe.outputs.exit_code }}"
          # Re-run cheaply (idempotent) to capture the verdict text for an
          # annotation and a commit comment: step summaries and logs are served
          # from hosts that are not reachable from every environment, while
          # check annotations and commit comments are served by api.github.com.
          set +e
          node scripts/production-probe.mjs > /tmp/probe-verdict.md
          set -e
          VERDICT=$(grep -oE '\*\*[A-Z_]+\*\*' /tmp/probe-verdict.md | head -1 | tr -d '*')
          echo "::notice title=production probe verdict::${VERDICT:-UNKNOWN} (exit $CODE) — full verdict in the job summary and commit comment"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/probe-verdict.md)" >/dev/null \
            || echo "::warning::could not post the probe verdict comment"
          case "$CODE" in
            0) echo "production reachable" ;;
            4) echo "production unverifiable from this runner — recorded as NETWORK_RESTRICTED, build stays green" ;;
            *) echo "::error::production probe reported a real problem (exit $CODE) — see the job summary verdict"; exit 1 ;;
          esac
