# Maharani Traders — native Android CI.
#
# This is the ACTIVE Android pipeline. It replaces the retired Capacitor /
# remote-URL WebView builder, which was removed together with
# capacitor.config.ts, www/ and scripts/android-postsync.mjs.
#
# It builds the committed native Kotlin/Compose project in android/ and nothing
# else. No release signing, no key, no AAB, no Play Store publication — a debug
# APK signed by Gradle's throwaway debug keystore only.

name: Native Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app/api/mobile/**'
      - 'lib/mobile/**'
      - 'lib/permissions/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/api/mobile/**'
      - 'lib/mobile/**'
      - 'lib/permissions/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install web dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type check
        run: corepack pnpm run typecheck

      - name: Lint
        run: corepack pnpm run lint

      - name: Run web tests
        run: corepack pnpm test

      - name: Build Next.js production app
        run: corepack pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  android:
    name: Android unit tests, lint, and debug APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and build cache
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify the Gradle wrapper distribution
        working-directory: android
        run: |
          ./gradlew --no-daemon --version | tee /tmp/gradle-version.txt
          grep -F 'Gradle 9.1.0' /tmp/gradle-version.txt

      # The Android Gradle Plugin's project model is not visible in the web UI
      # (Actions logs live in Azure blob storage). This step records the model
      # itself — the `android` extension type and the compileSdk it reports —
      # so a configuration failure can be diagnosed from check annotations
      # instead of guessed at.
      - name: Record the Gradle Android model (diagnostics)
        working-directory: android
        continue-on-error: true
        run: |
          set +e
          cat > /tmp/probe.init.gradle <<'GRADLE'
          def listener = [
            beforeEvaluate: { project -> },
            afterEvaluate: { project, state ->
              def ext = project.extensions.findByName("android")
              println "PROBE project=${project.path} androidExtension=${ext == null ? 'NONE' : ext.class.name}"
              println "PROBE ${project.path} buildFile=${project.buildFile} exists=${project.buildFile.exists()} bytes=${project.buildFile.exists() ? project.buildFile.length() : -1}"
              println "PROBE ${project.path} hasAgpPlugin=${project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')}"
              if (ext != null) {
                // Groovy property access goes through Gradle's dynamic-object
                // path, which is what a build script itself uses. Reflection on
                // the base class can miss AgpDecorated/Property-backed state.
                ["namespace", "compileSdk", "compileSdkVersion"].each { name ->
                  try {
                    println "PROBE ${project.path} ext.${name} = ${ext.${name}}"
                  } catch (Throwable t) {
                    println "PROBE ${project.path} ext.${name} THREW ${t.class.name}: ${t.message}"
                  }
                }
                try {
                  println "PROBE ${project.path} defaultConfig.minSdk = ${ext.defaultConfig?.minSdk}"
                  println "PROBE ${project.path} defaultConfig.targetSdk = ${ext.defaultConfig?.targetSdk}"
                } catch (Throwable t) {
                  println "PROBE ${project.path} defaultConfig THREW ${t.class.name}: ${t.message}"
                }
              }
              if (state != null && state.failure != null) {
                println "PROBE ${project.path} EVALUATION-FAILED ${state.failure.class.name}"
                state.failure.message?.readLines()?.take(6)?.each { println "PROBE ${project.path}   | ${it}" }
              }
            }
          ] as org.gradle.api.ProjectEvaluationListener
          gradle.addProjectEvaluationListener(listener)
          GRADLE
          ./gradlew --no-daemon --init-script /tmp/probe.init.gradle -q help > /tmp/probe.log 2>&1
          echo "--- probe finished (exit $?); PROBE lines: ---"
          grep -E "^PROBE " /tmp/probe.log | head -40
          # Emit from THIS step: a check run has an annotation budget, and the
          # Gradle-failure step spends it on the build error.
          if grep -qE "^PROBE " /tmp/probe.log; then
            grep -E "^PROBE " /tmp/probe.log | awk '!seen[$0]++' | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::probe produced no PROBE lines; last 25 lines of /tmp/probe.log follow"
            tail -25 /tmp/probe.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          echo "::error::END OF PROBE OUTPUT"
          ./gradlew --no-daemon --init-script /tmp/probe.init.gradle -q help > /tmp/probe.log 2>&1
          echo "--- probe finished; PROBE lines: ---"
          grep -E "^PROBE " /tmp/probe.log | head -40

      - name: Run Android unit tests, lint, and assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee /tmp/gradle.log

      # Azure blob storage (where Actions logs live) is not reachable from every
      # environment, so the failure detail is re-emitted as CHECK ANNOTATIONS,
      # which are served by api.github.com. Without this a compiler error would
      # be invisible outside the web UI.
      - name: Surface Gradle failures as check annotations
        if: failure()
        run: |
          set +e
          LOG=/tmp/gradle.log
          if [ ! -f "$LOG" ]; then
            echo "::error::Gradle produced no log file — the step failed before the build started."
            exit 0
          fi
          # Emit the ROOT cause first: Gradle prints the outer exception, then
          # "What went wrong", then the real cause. An earlier version of this
          # step matched only the outer lines and hid the actual message.
          emit() { printf '%s\n' "$1" | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done; }

          WHY=$(awk '/^\* What went wrong:/{f=1} f{print; c++} c>18{exit}' "$LOG")
          [ -z "$WHY" ] && WHY=$(awk '/What went wrong/{f=1} f{print; c++} c>18{exit}' "$LOG")
          [ -n "$WHY" ] && emit "=== What went wrong ===" && emit "$WHY"

          CAUSES=$(grep -E "Caused by:" "$LOG" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -12)
          [ -n "$CAUSES" ] && emit "=== Caused by ===" && emit "$CAUSES"

          KTERR=$(grep -E "^(e|w): " "$LOG" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -30)
          [ -n "$KTERR" ] && emit "=== Kotlin diagnostics ===" && emit "$KTERR"

          if [ -f /tmp/probe.log ]; then
            PROBE=$(grep -E "^PROBE " /tmp/probe.log | awk '!seen[$0]++' | head -28)
            [ -n "$PROBE" ] && emit "=== Gradle Android model ===" && emit "$PROBE"
            # The probe is a diagnostic: if it crashed, its own error must be
            # visible too, or a broken probe looks like a project with no model.
            if [ -z "$PROBE" ]; then
              emit "=== Probe produced no PROBE lines; tail ==="
              emit "$(grep -v '^[[:space:]]*$' /tmp/probe.log | tail -14)"
            fi
          else
            emit "=== Probe never wrote /tmp/probe.log ==="
          fi

          if [ -z "$WHY$CAUSES$KTERR" ]; then
            emit "=== No known pattern matched; tail of the log ==="
            emit "$(grep -v "^[[:space:]]*$" "$LOG" | tail -25)"
          fi
          echo "::notice::Full Gradle log is in the failed step's output and in the Gradle test/lint reports artifact."

      - name: Verify debug APK identity
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -f "$APK_PATH"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK_PATH" | grep -F "package: name='com.maharanitraders.app'"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maharani-traders-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
