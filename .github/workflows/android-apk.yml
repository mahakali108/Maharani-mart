# Maharani Traders — native Android CI.
#
# This is the ACTIVE Android pipeline. It replaces the retired Capacitor /
# remote-URL WebView builder, which was removed together with
# capacitor.config.ts, www/ and scripts/android-postsync.mjs.
#
# It builds the committed native Kotlin/Compose project in android/ and nothing
# else. No release signing, no key, no AAB, no Play Store publication — a debug
# APK signed by Gradle's throwaway debug keystore only.

name: Native Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app/api/mobile/**'
      - 'lib/mobile/**'
      - 'lib/permissions/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app/api/mobile/**'
      - 'lib/mobile/**'
      - 'lib/permissions/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  # Only used to post the build-diagnostics bundle as a pull-request comment:
  # Actions log files and artifacts are served from a host that is unreachable
  # from some environments, while api.github.com is not.
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install web dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type check
        run: corepack pnpm run typecheck

      - name: Lint
        run: corepack pnpm run lint

      - name: Run web tests
        run: corepack pnpm test

      - name: Build Next.js production app
        run: corepack pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  android:
    name: Android unit tests, lint, and debug APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and build cache
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify the Gradle wrapper distribution
        working-directory: android
        run: |
          ./gradlew --no-daemon --version | tee /tmp/gradle-version.txt
          grep -F 'Gradle 9.1.0' /tmp/gradle-version.txt

      # The Android Gradle Plugin's project model is not visible in the web UI
      # (Actions logs live in Azure blob storage). This step records the model
      # itself — the `android` extension type and the compileSdk it reports —
      # so a configuration failure can be diagnosed from check annotations
      # instead of guessed at.
      - name: Record the Gradle Android model (diagnostics)
        working-directory: android
        continue-on-error: true
        run: |
          set +e
          emit_block() {
            # Cut first, escape second: a byte-truncated escape sequence would
            # leave a dangling % in the annotation.
            local title="$1" body
            body=$(sed -e 's/\r//g' | head -n 100 | cut -c1-400 | sed -e 's/%/%25/g' \
                     | awk '{printf "%s%%0A", $0}')
            printf '::error title=%s::%s\n' "$title" "$body"
          }
          cat > /tmp/probe.init.gradle <<'GRADLE'
          def listener = [
            beforeEvaluate: { project -> },
            afterEvaluate: { project, state ->
              def ext = project.extensions.findByName("android")
              println "PROBE project=${project.path} androidExtension=${ext == null ? 'NONE' : ext.class.name} identity=${System.identityHashCode(ext)}"
              println "PROBE ${project.path} buildFile=${project.buildFile} exists=${project.buildFile.exists()} bytes=${project.buildFile.exists() ? project.buildFile.length() : -1}"
              println "PROBE ${project.path} hasAgpPlugin=${project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')}"
              if (ext != null) {
                // Groovy property access goes through Gradle's dynamic-object
                // path, which is what a build script itself uses. Reflection on
                // the base class can miss AgpDecorated/Property-backed state.
                ["namespace", "compileSdk", "compileSdkVersion"].each { name ->
                  try {
                    println "PROBE ${project.path} ext.${name} = ${ext."${name}"}"
                  } catch (Throwable t) {
                    println "PROBE ${project.path} ext.${name} THREW ${t.class.name}: ${t.message}"
                  }
                }
                try {
                  println "PROBE ${project.path} defaultConfig.minSdk = ${ext.defaultConfig?.minSdk}"
                  println "PROBE ${project.path} defaultConfig.targetSdk = ${ext.defaultConfig?.targetSdk}"
                  println "PROBE ${project.path} defaultConfig.applicationId = ${ext.defaultConfig?.applicationId}"
                } catch (Throwable t) {
                  println "PROBE ${project.path} defaultConfig THREW ${t.class.name}: ${t.message}"
                }
              }
              if (state != null && state.failure != null) {
                println "PROBE ${project.path} EVALUATION-FAILED ${state.failure.class.name}"
                state.failure.message?.readLines()?.take(6)?.each { println "PROBE ${project.path}   | ${it}" }
              }
            }
          ] as org.gradle.api.ProjectEvaluationListener
          gradle.addProjectEvaluationListener(listener)
          GRADLE
          rm -f /tmp/app-script-markers.txt
          ./gradlew --no-daemon --init-script /tmp/probe.init.gradle help > /tmp/probe.log 2>&1
          echo "--- probe finished (exit $?); PROBE lines: ---"
          grep -E "^PROBE |^PROBE app-script:" /tmp/probe.log | head -40
          echo "--- file markers written by the build scripts (probe run) ---"
          cat /tmp/app-script-markers.txt 2>/dev/null || echo "(none)"
          # Only about ten annotations per step survive, and the check-run API
          # does not return them in emission order, so a section of the log is
          # emitted as ONE annotation with escaped newlines (%0A) instead of a
          # stream of single-line ones. The build scripts' own markers come
          # first: they answer "did the android {} block run at all".
          if grep -qE "^PROBE " /tmp/probe.log; then
            grep -E "script: |EVALUATION-FAILED" /tmp/probe.log | awk '!seen[$0]++' \
              | emit_block "probe: build-script markers and evaluation failures"
            grep -E "^PROBE " /tmp/probe.log | grep -vE "script: |EVALUATION-FAILED" \
              | awk '!seen[$0]++' | head -60 \
              | emit_block "probe: android project model"
            cat /tmp/app-script-markers.txt 2>/dev/null \
              | emit_block "probe: build-script file markers (probe run)"
          else
            tail -40 /tmp/probe.log | emit_block "probe: no PROBE lines, log tail"
          fi

      - name: Run Android unit tests, lint, and assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee /tmp/gradle.log

      # Azure blob storage (where Actions logs live) is not reachable from every
      # environment, so the failure detail is re-emitted as CHECK ANNOTATIONS,
      # which are served by api.github.com. Without this a compiler error would
      # be invisible outside the web UI.
      - name: Surface Gradle failures as check annotations
        if: failure()
        run: |
          set +e
          LOG=/tmp/gradle.log
          if [ ! -f "$LOG" ]; then
            echo "::error::Gradle produced no log file — the step failed before the build started."
            exit 0
          fi
          # Emit the ROOT cause first: Gradle prints the outer exception, then
          # "What went wrong", then the real cause. An earlier version of this
          # step matched only the outer lines and hid the actual message.
          # One annotation per section, newlines escaped as %0A: the step has an
          # annotation budget of about ten, and the check-run API does not
          # preserve emission order.
          emit_block() {
            # Cut first, escape second: a byte-truncated escape sequence would
            # leave a dangling % in the annotation.
            local title="$1" body
            body=$(sed -e 's/\r//g' | head -n 100 | cut -c1-400 | sed -e 's/%/%25/g' \
                     | awk '{printf "%s%%0A", $0}')
            printf '::error title=%s::%s\n' "$title" "$body"
          }

          WHY=$(awk '/^\* What went wrong:/{f=1} f{print; c++} c>24{exit}' "$LOG")
          [ -z "$WHY" ] && WHY=$(awk '/What went wrong/{f=1} f{print; c++} c>24{exit}' "$LOG")
          [ -n "$WHY" ] && printf '%s\n' "$WHY" | emit_block "gradle: what went wrong"

          CAUSES=$(grep -E "Caused by:" "$LOG" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -20)
          [ -n "$CAUSES" ] && printf '%s\n' "$CAUSES" | emit_block "gradle: caused by"

          KTERR=$(grep -E "^(e|w): " "$LOG" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -40)
          [ -n "$KTERR" ] && printf '%s\n' "$KTERR" | emit_block "kotlin diagnostics"

          if [ -f /tmp/probe.log ]; then
            PROBE=$(grep -E "script: |EVALUATION-FAILED" /tmp/probe.log | awk '!seen[$0]++' | head -20)
            [ -n "$PROBE" ] && printf '%s\n' "$PROBE" | emit_block "probe: script markers"
            # The probe is a diagnostic: if it crashed, its own error must be
            # visible too, or a broken probe looks like a project with no model.
            if [ -z "$PROBE" ]; then
              grep -v '^[[:space:]]*$' /tmp/probe.log | tail -20 | emit_block "probe: no script markers, log tail"
            fi
          else
            echo "::error title=probe::probe never wrote /tmp/probe.log"
          fi

          if [ -z "$WHY$CAUSES$KTERR" ]; then
            grep -v "^[[:space:]]*$" "$LOG" | tail -30 | emit_block "gradle: no known pattern, log tail"
          fi
          echo "::notice::Full Gradle log is in the failed step's output and in the Gradle test/lint reports artifact."

      - name: Verify debug APK identity
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -f "$APK_PATH"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK_PATH" | grep -F "package: name='com.maharanitraders.app'"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maharani-traders-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Actions log files are served from a host that is not reachable from every
      # environment, and check annotations are capped at about ten per step. On a
      # failure that is not enough to see a Gradle stack trace, so everything the
      # job printed is bundled here as a downloadable artifact instead.
      - name: Bundle build diagnostics
        if: always()
        run: |
          set +e
          OUT=/tmp/diagnostics.txt
          {
            echo "=== HEAD ==="; git rev-parse HEAD 2>/dev/null
            echo "=== java ==="; java -version 2>&1 | head -3
            echo "=== gradle ==="; sed -n '1,10p' /tmp/gradle-version.txt 2>/dev/null
            echo "=== script markers (probe log) ==="; grep -E "script: |EVALUATION-FAILED" /tmp/probe.log 2>/dev/null
            echo "=== script markers (files) ==="; cat /tmp/app-script-markers.txt 2>/dev/null
            echo "=== probe model ==="; grep -E "^PROBE " /tmp/probe.log 2>/dev/null | head -80
            echo "=== configuration cache ==="
            grep -iE "configuration cache|reusing configuration|configuration-cache" /tmp/gradle.log /tmp/probe.log 2>/dev/null | head -20
            echo "=== what went wrong ==="
            awk '/^\* What went wrong:/{f=1} f{print; c++} c>30{exit}' /tmp/gradle.log 2>/dev/null
            echo "=== caused by ==="
            grep -E "Caused by:" /tmp/gradle.log 2>/dev/null | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -25
            echo "=== kotlin diagnostics ==="
            grep -E "^(e|w): " /tmp/gradle.log 2>/dev/null | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -60
            echo "=== gradle log tail ==="; tail -60 /tmp/gradle.log 2>/dev/null
          } > "$OUT" 2>&1
          wc -l "$OUT" || true
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-build-diagnostics
          path: /tmp/diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

      # Log files and artifacts are served from a host that is unreachable from
      # some environments; api.github.com is not, so the same bundle is posted as
      # a pull-request comment. Non-fatal by design: a comment failure must never
      # turn a diagnosable build into an undiagnosable one.
      - name: Post the diagnostics bundle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
                 --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "no open pull request for $GITHUB_REF_NAME — nothing to post"
            exit 0
          fi
          {
            printf '### Android CI diagnostics — \`%s\`\n\n' "${GITHUB_SHA:0:7}"
            printf '```\n'
            head -c 55000 /tmp/diagnostics.txt
            printf '\n```\n'
          } > /tmp/diagnostics-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnostics-comment.md \
            || echo "::warning::could not post the diagnostics comment"
          # Keep the PR from filling up with debugging noise: remove any previous
          # comment from this bot that carries the same heading.
          echo "posted diagnostics for ${GITHUB_SHA:0:7} to #$PR"

      - name: Upload Gradle test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-reports
          path: android/**/build/reports
          if-no-files-found: warn
          retention-days: 7
