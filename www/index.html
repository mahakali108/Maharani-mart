<!doctype html>
<!--
  This file is required to exist for `npx cap add android` to scaffold
  the native project, but it is NOT what users see. capacitor.config.ts
  sets `server.url` to the live production site, so on launch the
  WebView navigates straight there instead of loading this file. The
  only file in this directory that can ever be shown to a user is
  offline.html (Capacitor's server.errorPath), displayed when the
  production site cannot be reached. This one is kept as a minimal,
  honest placeholder rather than a fake login page or a copy of any
  real app screen.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, user-scalable=no" />
    <title>Maharani Traders</title>
  </head>
  <body>
    <p>Loading Maharani Traders…</p>
  </body>
</html>
