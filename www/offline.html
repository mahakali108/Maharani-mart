<!doctype html>
<!--
  Offline / connection-error screen for the Maharani Traders Android
  app. Capacitor loads this LOCAL file (server.errorPath in
  capacitor.config.ts) only when the remote production URL fails to
  load — e.g. no internet, DNS failure, or the server is unreachable.

  It deliberately does NOT fake any app functionality: no cached
  products, no offline cart, no pretend order state. It only tells
  the user the connection is down and offers a Retry that reloads the
  real production site once connectivity returns.

  NOTE: keep the URL in RETRY_URL in sync with PRODUCTION_URL in
  capacitor.config.ts (single manual sync point, documented there).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, user-scalable=no" />
    <title>Maharani Traders</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .wrap { max-width: 340px; }
      .mark {
        width: 72px; height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #c8102e;
        color: #ffffff;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 800; letter-spacing: 0.5px;
      }
      h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
      p.brand { font-size: 13px; font-weight: 600; color: #c8102e; margin-bottom: 24px; letter-spacing: 0.3px; }
      p.msg { font-size: 14.5px; line-height: 1.55; color: #6d6d6d; margin-bottom: 28px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #c8102e; color: #fff;
        font-size: 15px; font-weight: 600;
        padding: 13px 40px; border-radius: 12px;
        width: 100%;
      }
      button:active { background: #a80c26; }
      .status { margin-top: 14px; font-size: 12.5px; color: #888888; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">MT</div>
      <h1>No internet connection</h1>
      <p class="brand">Maharani Traders</p>
      <p class="msg">No internet connection. Please check your connection and try again.</p>
      <button id="retry" type="button">Retry</button>
      <div class="status" id="status" role="status"></div>
    </div>
    <script>
      // Must match PRODUCTION_URL in capacitor.config.ts.
      var RETRY_URL = 'https://maharani-mart-mahakali108s-projects.vercel.app';
      var statusEl = document.getElementById('status');
      function retry() {
        statusEl.textContent = 'Reconnecting\u2026';
        window.location.replace(RETRY_URL);
      }
      document.getElementById('retry').addEventListener('click', retry);
      // Auto-retry once the OS reports connectivity is back.
      window.addEventListener('online', retry);
      if (!navigator.onLine) {
        statusEl.textContent = 'Waiting for network\u2026';
      }
    </script>
  </body>
</html>
