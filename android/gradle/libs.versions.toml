# Single pinned version catalog for the native Android app.
#
# Every version here is traceable in docs/NATIVE_ANDROID_MIGRATION_PLAN.md §1:
#  - AGP 9.0.1 / Gradle 9.1.0 / JDK 17 / compileSdk+targetSdk 36 come from the
#    AGP 9.0.1 compatibility table plus Google Play's 2026 API-36 requirement.
#  - Kotlin 2.4.20 is within JetBrains' published Gradle/AGP compatibility range
#    for Gradle 9.1.0 and AGP 9.0.1; KSP 2.3.10 is its published quickstart pairing.
#    AGP 9's built-in Kotlin is used (the `org.jetbrains.kotlin.android` plugin is
#    NOT compatible with AGP 9's new DSL), so this version is also pinned as the
#    KGP classpath in `android/build.gradle.kts` — the two must stay in step
#    (asserted by tests/android-project-integrity.test.ts).
#  - Hilt 2.60.1, Retrofit 3.0.0, OkHttp 5.3.2, Compose 1.10.3 / Material3
#    1.4.0, coroutines 1.10.2, and serialization 1.10.0 are pinned below.
#  - Compose is intentionally NOT on the newest BOM: Compose 1.12 / BOM 2026.08+
#    raises compileSdk to 37, which AGP 9.0.1 (max API 36.1) does not support.
#  - androidx.compose.material:material-icons-* is NOT a dependency. Google
#    deprecated those artifacts and STOPPED PUBLISHING them after 1.7.x, so a
#    `version.ref = "composeUi"` pin resolved to a version that does not exist
#    and broke dependency resolution. The app draws the one icon it needs
#    (see `MaharaniIcons.Menu`) instead of shipping a 1.4 MB deprecated enum.
#
# Upgrades are separate, reviewed changes — never a drive-by bump.

[versions]
agp = "9.0.1"
kotlin = "2.4.20"
ksp = "2.3.10"
# Hilt 2.59.0/2.59.1 shipped broken AGP 9 support: the plugin verified the
# `hilt-android` dependency through the retired "android-classes" transform and
# reported "no com.google.dagger:hilt-android dependency was found" for a module
# that declares it (google/dagger#5099, #5116). 2.59.2 replaced that transform
# with AGP attribute rules; 2.60.1 carries the follow-up fixes.
hilt = "2.60.1"

coreKtx = "1.17.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
navigationCompose = "2.9.7"
composeUi = "1.10.3"
composeMaterial3 = "1.4.0"
hiltNavigationCompose = "1.3.0"
splashscreen = "1.2.0"
datastore = "1.2.0"

coroutines = "1.10.2"
serialization = "1.10.0"
retrofit = "3.0.0"
okhttp = "5.3.2"
# Coil 3.6.0 raised the Android compile SDK its AARs declare to 37, and this
# project compiles against 36 — the maximum AGP 9.0.1 supports. Consuming 3.6.x
# fails `:app:checkDebugAarMetadata` with "requires libraries and applications
# that depend on it to compile against version 37 or later".
#
# 3.5.0 is NOT a workaround either: it is built against Compose 1.11.1, which is
# newer than the composeUi pin below, so Gradle would resolve Compose upward and
# silently upgrade it app-wide. 3.4.0 is the newest release that stays at or
# below both this project's compileSdk (35 <= 36) and its Compose pin
# (1.9.3 < 1.10.3), so adopting it upgrades nothing.
#
# Bumping this therefore requires bumping compileSdk AND AGP AND the pinned
# `platforms;android-36` in .github/workflows/android-apk.yml together. See
# tests/android-project-integrity.test.ts, which enforces the ceiling.
coil = "3.4.0"

junit = "4.13.2"
turbine = "1.2.1"
truth = "1.4.5"

[libraries]
# AndroidX core / lifecycle / navigation
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# Compose
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "composeUi" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }

# Kotlin / coroutines / serialization
# kotlinx-coroutines-core arrives transitively via coroutines-android; it is
# deliberately not aliased (2026-10 size audit: no module declares it).
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Networking (Retrofit 3 + OkHttp 5 via BOMs; the kotlinx-serialization converter
# is Retrofit's own — no third-party converter artifact)
retrofit-bom = { module = "com.squareup.retrofit2:retrofit-bom", version.ref = "retrofit" }
retrofit = { module = "com.squareup.retrofit2:retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver" }

# Dependency injection
# hilt-android-testing is intentionally absent: the project runs JVM unit tests
# only, and no @HiltAndroidTest exists (2026-10 size audit).
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Image loading (introduced with the catalog in Phase B, used from Phase D)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
