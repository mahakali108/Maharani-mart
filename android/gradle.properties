# Gradle / JVM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships a new DSL that becomes mandatory in AGP 10. This project stays on
# the classic DSL for now and migrates BEFORE AGP 10 (tracked in
# docs/NATIVE_ANDROID_MIGRATION_PLAN.md §1). Without this opt-out the AGP 9
# default DSL changes how the module build files are interpreted.
android.newDsl=false

# AGP 9 enables built-in Kotlin by default. This project deliberately keeps the
# version-catalog-pinned org.jetbrains.kotlin.android plugin, so opt out of the
# built-in plugin as documented by Android. This is separate from android.newDsl.
android.builtInKotlin=false

# Kotlin
kotlin.code.style=official
