# Gradle / JVM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 uses its NEW DSL by default; android.newDsl=false re-enables the legacy
# one. Do NOT set that opt-out: with it, `:app` configured but AGP's
# createAndroidTasks() then reported "project ':app' does not specify
# `compileSdk`" (the value is set in android/app/build.gradle.kts next to it),
# and Hilt's dependency check cascaded into "no com.google.dagger:hilt-android
# dependency was found". Every module here already uses the property-style DSL
# (`compileSdk = 36`, `minSdk = 24`), so the default path is the supported one.

# Built-in Kotlin is left at its AGP 9 default (ON). AGP 9's error is explicit:
#   "The 'org.jetbrains.kotlin.android' plugin is not compatible with AGP's 9.0
#    new DSL ... Set android.builtInKotlin=true and migrate to built-in Kotlin,
#    or set android.newDsl=false to temporarily bypass this issue."
# and android.newDsl=false is the path that produced the false
# "project ':app' does not specify compileSdk" error above. So the plugin is
# removed from every module instead; AGP compiles Kotlin itself.
#   kotlin { compilerOptions { jvmTarget } }  stays - it is the documented
# replacement for android.kotlinOptions {} and the only supported jvmTarget DSL.

# Kotlin
kotlin.code.style=official
