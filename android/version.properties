# =============================================================================
# Maharani Traders — Android release version. SINGLE SOURCE OF TRUTH.
# =============================================================================
#
# android/app/build.gradle.kts reads this file and DERIVES both values Gradle
# needs, so they can never disagree with each other:
#
#     versionName = "$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH"
#     versionCode = $VERSION_CODE
#
# There is deliberately no place to hand-write a versionName. Every previous
# build carried a literal in build.gradle.kts, and that literal still said
# "1.0.0-phase-b" long after Phase B ended — a pre-release marker that must
# never reach a retailer's phone (docs/ANDROID_RELEASE_CHECKLIST.md §1).
#
# -----------------------------------------------------------------------------
# POLICY — how to increment for the 11 October 2026 public launch and after
# -----------------------------------------------------------------------------
# VERSION_CODE  Google Play and the Android package installer both require this
#               to STRICTLY INCREASE for every build offered to a device, and to
#               never be reused. It is an opaque integer: it is not derived from
#               the date, the run number or the semver, because any of those can
#               repeat or go backwards. Bump it by exactly 1 per release, and
#               bump it in the SAME commit as the change being released, so the
#               artifact and the version move together.
#               A device offered a build whose versionCode is <= the installed
#               one refuses the update (INSTALL_FAILED_VERSION_DOWNGRADE), which
#               is why CI verifies the built artifact's versionCode against this
#               file rather than trusting the file alone.
#
# VERSION_MAJOR breaking retailer workflow or API-contract changes.
# VERSION_MINOR new retailer features, backwards compatible.
# VERSION_PATCH fixes only — no new surface.
#
# The suffix rules are enforced by tests/android-release-versioning.test.ts:
#   * versionName is always exactly MAJOR.MINOR.PATCH — no "-phase-b", "-rc1",
#     "-SNAPSHOT" or build metadata. A pre-release marker in a public artifact is
#     how a test build gets mistaken for a launch build.
#   * pre-release identity belongs in the BUILD VARIANT or the distribution
#     channel (internal track, a separate applicationIdSuffix), never in the
#     version string a shopkeeper reads.
#
# -----------------------------------------------------------------------------
# CURRENT VALUES — first public release
# -----------------------------------------------------------------------------
# 1.0.0 / code 1 is correct for the 11 October 2026 launch because nothing has
# ever been distributed to a retailer before it: no Play Console entry exists and
# no APK has been handed out (docs/ANDROID_RELEASE_CHECKLIST.md §0). If a build
# was ever installed on a real device outside CI, raise VERSION_CODE above that
# build's code BEFORE releasing, or those devices cannot update.
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=0
VERSION_CODE=1
